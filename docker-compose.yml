# 开发用 Docker Compose：api + worker + sandbox-runner + PostgreSQL 17 + 本地 S3 兼容对象存储（SeaweedFS）+ Redis（Valkey 8）。
# 用法：
#   1. server/scripts/init-dev-secrets.sh   # 首次运行：生成数据库密码、AI 主密钥、对象存储密钥、Redis 密码和沙箱服务令牌到 server/.dev-secrets/（不入库）
#   2. docker compose up --build            # migrate 执行完迁移后 api 才启动
#   3. 访问 http://localhost:3000/healthz 和 /readyz
#   4. 创建首个平台管理员：cd server && MIGRATION_DATABASE_PASSWORD_FILE=.dev-secrets/db_owner_password npm run admin:create -- --email <邮箱>
# 已有的数据卷是 旧仓库 PR #29 之前初始化的（缺少 bidtools_auth 角色）时，先 docker compose down -v 重建。
# 旧仓库 PR #34 起新增 s3 服务：已有的开发环境需要重新运行 init-dev-secrets.sh 生成 s3_secret_key（已有的文件不会被覆盖）。
# 6.1 起新增 redis 服务：同样需要重新运行 init-dev-secrets.sh 生成 redis_password。
# 6.2 起新增 worker 服务和数据库角色 bidtools_jobs：已有的数据卷不会重跑初始化脚本，先 docker compose down -v 重建（或按 server/db/init/10-provision.sh 手工建角色）。
# 6.4 起 worker 也拿 AI 主密钥（ai_kek），任务中的模型调用在 worker 中经 AI 网关进行；不需要新的 secret 或角色。
# 6.6 起 worker 加入 sandbox-control 网络、拿对象存储密钥和沙箱服务令牌执行文档解析；parse 镜像加入了解析入口，改过后重新构建。
# 6.5 起新增 sandbox-runner 服务（解析沙箱，docs/SERVER_DESIGN.md 第 7.5 节）：
#   - 重新运行 init-dev-secrets.sh 生成 sandbox_runner_token；
#   - 先构建 parse 沙箱镜像：docker build -t zhibiao-parse:dev server/sandbox/parse
#   - sandbox-runner 要访问宿主的 Docker socket：Linux 上设置 DOCKER_SOCKET_GID=$(stat -c %g /var/run/docker.sock)，
#     Docker Desktop 上不用设置（默认 0）；安装了 gVisor 的机器可设置 SANDBOX_RUNTIME=runsc（生产只允许 runsc）。
# 7.1 起 sandbox-runner 可以创建 export 沙箱（OpenXmlHelper + Chromium，docs/SERVER_DESIGN.md 第 7.9 节），样张接口上线（7.3e）起必需：
#   - 构建镜像（在仓库根目录）：docker build -t zhibiao-export:dev --build-context openxmlhelper=openxmlhelper
#       --build-context chrome=client/electron/shared/chrome
#       --build-context preview-assets=client/assets/content-template-preview
#       --build-context desktop=client/electron server/sandbox/export（7.3b 起含样张配图，7.5b 起含桌面版的可研导出代码）
#   - sandbox-runner 使用 zhibiao-export:dev（SANDBOX_EXPORT_IMAGE，未配置时 sandbox-runner 拒绝启动）。
# 8.1 起 sandbox-runner 可以创建 agent 沙箱（每个沙箱一个只通 agent-gw 的 internal 网络，docs/SERVER_DESIGN.md 第 7.10 节）。
#   Agent 任务上线（8.6）之前不需要：SANDBOX_AGENT_IMAGE 未配置时只是不能创建 agent 沙箱（SANDBOX_AGENT_GATEWAY 8.2b 起指向 agent-gw）；
#   镜像：docker build -t zhibiao-agent:dev server/sandbox/agent。
# 8.2b 起新增 agent-gw 服务（agent 沙箱访问平台的唯一入口，docs/SERVER_DESIGN.md 第 7.12 节）：不需要新的 secret 或角色，
#   worker 加入 internal 网络 agent-relay 并在 3200 端口开 Agent 内部入口；sandbox-runner 的 SANDBOX_AGENT_GATEWAY 指向它的容器名。
# 重建数据库：docker compose down -v（会删除数据卷）。
# 生产部署的 compose 与网络划分见 docs/SERVER_DESIGN.md 第 8.1 节，不使用本文件。
name: bidtools-dev

x-hardening: &hardening
  read_only: true
  tmpfs:
    - /tmp:size=64m
  cap_drop:
    - ALL
  security_opt:
    - no-new-privileges:true
  init: true

x-database-env: &database-env
  DATABASE_HOST: postgres
  DATABASE_PORT: "5432"
  DATABASE_NAME: bidtools

services:
  postgres:
    # 按 digest 固定（docs/SERVER_DESIGN.md 第 8.1 节），升级时同时更新标签和 digest；与 CI 的服务容器一致。
    image: postgres:17.11-bookworm@sha256:3645570cccdfa447589da9f57dd740faa29b30938e861289a5574b6ca6b03826
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
      POSTGRES_DB: postgres
      APP_DB_NAME: bidtools
    secrets:
      - postgres_password
      - db_owner_password
      - db_app_password
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./server/db/init:/docker-entrypoint-initdb.d:ro
    ports:
      # 只绑定本机回环地址，供本机的迁移命令和数据库客户端使用，不对局域网暴露。
      - "127.0.0.1:5432:5432"
    shm_size: 128m
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD-SHELL", "pg_isready --username=postgres --dbname=postgres"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  # 本地 S3 兼容对象存储，只用于开发和本机测试；生产环境用云厂商的对象存储（docs/SERVER_DESIGN.md 第 6.3 节）。
  # SeaweedFS（Apache-2.0）的单进程模式 weed mini，启动时创建 bucket。按 digest 固定，升级时同时更新标签和 digest；与 CI 一致。
  # 必须设置访问密钥：不设置时 SeaweedFS 接受任意密钥。关闭遥测（默认会向 SeaweedFS 官方上报统计）、管理界面、WebDAV 和
  # Iceberg / Lance 接口；只有 S3 端口 8333 映射到本机回环地址，其余端口不对外。
  s3:
    image: chrislusf/seaweedfs:4.48@sha256:4e61d15fd35994cb1e43e1e553dff106794841fd9a99ade2fc8c8bfce4d7872d
    user: "1000:1000"
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        export AWS_SECRET_ACCESS_KEY="$$(cat /run/secrets/s3_secret_key)" &&
        exec /entrypoint.sh mini -dir=/data -ip=127.0.0.1 -ip.bind=0.0.0.0
        -master.telemetry=false -admin.ui=false -webdav=false -s3.port.iceberg=0 -s3.port.lance=0
        -s3.autoCreateBucket=false -bucket=bidtools-dev
    environment:
      AWS_ACCESS_KEY_ID: bidtools-dev
    secrets:
      - s3_secret_key
    volumes:
      - s3data:/data
    ports:
      # 只绑定本机回环地址，供本机的集成测试使用，不对局域网暴露。
      - "127.0.0.1:8333:8333"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8333/healthz"]
      interval: 5s
      timeout: 3s
      retries: 30
    <<: *hardening
    restart: unless-stopped

  # Redis：Valkey 8（BSD-3-Clause，docs/MIGRATION_PLAN.md 第 6 步决定事项第 3 项），任务队列、事件推送、限流共用。
  # 按 digest 固定，升级时同时更新标签和 digest；与 CI 一致。启动脚本禁用 default 用户、按密码文件创建 ACL 用户 bidtools，
  # 不持久化（见 server/redis/start-valkey.sh）。只在 backend 网络上，postgres、s3、migrate 连不到它。
  redis:
    image: valkey/valkey:8.1.10-trixie@sha256:640c5e62cea04b6d6f2084232651d0cc70362d31f4f805e7be94dbed6855e8f2
    # 镜像中的 valkey 用户；不经镜像的入口脚本（以 root 启动再降权，需要 SETUID / SETGID 能力）。
    user: "999:999"
    entrypoint: ["/bin/sh", "/opt/start-valkey.sh"]
    environment:
      REDIS_PASSWORD_FILE: /run/secrets/redis_password
    secrets:
      - redis_password
    volumes:
      - ./server/redis/start-valkey.sh:/opt/start-valkey.sh:ro
    networks:
      - backend
    ports:
      # 只绑定本机回环地址，供本机的集成测试使用，不对局域网暴露。
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=\"$$(cat /run/secrets/redis_password)\" valkey-cli --user bidtools ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 20
    <<: *hardening
    restart: unless-stopped

  migrate:
    image: bidtools-api:dev
    build:
      context: ./server
    command: ["node", "dist/db/migrate.js", "latest"]
    environment:
      <<: *database-env
      MIGRATION_DATABASE_USER: bidtools_owner
      MIGRATION_DATABASE_PASSWORD_FILE: /run/secrets/db_owner_password
    secrets:
      - db_owner_password
    depends_on:
      postgres:
        condition: service_healthy
    <<: *hardening
    restart: "no"

  api:
    image: bidtools-api:dev
    build:
      context: ./server
    environment:
      NODE_ENV: development
      LOG_LEVEL: debug
      # 浏览器只在 localhost 上接受非 https 的 Secure Cookie（__Host-session），开发时用 http://localhost:3000 访问。
      PUBLIC_ORIGIN: http://localhost:3000
      # 开发环境直连 api、前面没有反向代理，不信任任何代理：X-Forwarded-For 一律忽略，限流按连接对端地址计数
      # （经 127.0.0.1 端口映射进来的请求，对端地址都是 Docker 网关，相当于所有本机请求共用一个计数）。
      # 生产部署在 Caddy 后面时，只填 Caddy 容器的固定地址，见 docs/SERVER_DESIGN.md 第 8.1 节。
      TRUSTED_PROXIES: ""
      <<: *database-env
      DATABASE_USER: bidtools_app
      DATABASE_PASSWORD_FILE: /run/secrets/db_app_password
      # AI 网关的主密钥文件（开发用；生产环境换成云 KMS，docs/SERVER_DESIGN.md 第 4.2 节）。
      AI_KEK_FILE: /run/secrets/ai_kek
      # 对象存储（docs/SERVER_DESIGN.md 第 6.3 节）。生产环境换成云厂商的地址、地域和访问密钥。
      S3_ENDPOINT: http://s3:8333
      S3_REGION: us-east-1
      S3_BUCKET: bidtools-dev
      S3_FORCE_PATH_STYLE: "true"
      S3_ACCESS_KEY_ID: bidtools-dev
      S3_SECRET_ACCESS_KEY_FILE: /run/secrets/s3_secret_key
      # Redis 的 ACL 用户名写在地址中，密码走 secret（不写进连接串）。
      REDIS_URL: redis://bidtools@redis:6379
      REDIS_PASSWORD_FILE: /run/secrets/redis_password
    # 只拿应用角色的密码、主密钥、对象存储密钥和 Redis 密码，拿不到属主和超级用户密码；migrate 拿不到后三者。
    secrets:
      - db_app_password
      - ai_kek
      - s3_secret_key
      - redis_password
    depends_on:
      migrate:
        condition: service_completed_successfully
      s3:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - default
      - backend
    ports:
      # 只绑定本机回环地址，不对局域网暴露。
      - "127.0.0.1:3000:3000"
    <<: *hardening
    restart: unless-stopped

  # 任务队列的消费者（docs/SERVER_DESIGN.md 第 5 节）：与 api 同一镜像，入口为 dist/worker.js。不对外提供接口，
  # /healthz、/readyz 只监听容器内的回环地址，供镜像的 HEALTHCHECK 使用，不映射端口。
  # 需要数据库（default 网络）和 Redis（backend 网络）。6.4 起拿 AI 主密钥：任务中的模型调用经 AI 网关，在 worker 中解密平台 Key、
  # 冻结和结算。6.6 起执行文档解析：拿对象存储密钥（读原件、写产物）和沙箱服务令牌，加入 sandbox-control 网络调用 sandbox-runner；
  # 解析只在 sandbox-runner 创建的断网沙箱中进行，worker 不挂载 Docker socket。
  worker:
    image: bidtools-api:dev
    build:
      context: ./server
    command: ["node", "dist/worker.js"]
    environment:
      NODE_ENV: development
      LOG_LEVEL: debug
      HOST: 127.0.0.1
      <<: *database-env
      DATABASE_USER: bidtools_app
      DATABASE_PASSWORD_FILE: /run/secrets/db_app_password
      AI_KEK_FILE: /run/secrets/ai_kek
      REDIS_URL: redis://bidtools@redis:6379
      REDIS_PASSWORD_FILE: /run/secrets/redis_password
      S3_ENDPOINT: http://s3:8333
      S3_REGION: us-east-1
      S3_BUCKET: bidtools-dev
      S3_FORCE_PATH_STYLE: "true"
      S3_ACCESS_KEY_ID: bidtools-dev
      S3_SECRET_ACCESS_KEY_FILE: /run/secrets/s3_secret_key
      SANDBOX_RUNNER_URL: http://sandbox-runner:3100
      SANDBOX_RUNNER_TOKEN_FILE: /run/secrets/sandbox_runner_token
      # Agent 内部入口（8.2b）：只接收 agent-gw 经 agent-relay 转来的请求，每个请求按任务令牌查身份。开发环境在所有接口上监听，
      # 生产部署只绑定在 agent-relay 网络上的地址（第 9 步上线检查）。
      AGENT_ENDPOINT_HOST: 0.0.0.0
      AGENT_ENDPOINT_PORT: "3200"
    secrets:
      - db_app_password
      - ai_kek
      - redis_password
      - s3_secret_key
      - sandbox_runner_token
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      s3:
        condition: service_healthy
      sandbox-runner:
        condition: service_started
    networks:
      - default
      - backend
      - sandbox-control
      - agent-relay
    # 收到 SIGTERM 后中止执行中的任务（可续跑的回到 queued），最多等 25 秒（src/worker.ts）。
    stop_grace_period: 30s
    <<: *hardening
    restart: unless-stopped

  # 解析沙箱的管理服务（docs/SERVER_DESIGN.md 第 7.4、7.5 节）：与 api 同一镜像，入口为 dist/sandbox-runner.js。
  # 唯一挂载 Docker socket 的服务（能创建容器即等同宿主 root），只按代码中写死的 parse、export 模板创建断网的沙箱容器；
  # 只在 internal 网络 sandbox-control 上监听，不映射端口、不能访问外网和其他服务。只有 worker（6.6 起）加入该网络并拿令牌调用它。
  # 沙箱容器由它经宿主的 Docker 创建，不在本 compose 项目中；到期的沙箱（parse 15 分钟、export 5 / 35 分钟）由它定期删除。
  sandbox-runner:
    image: bidtools-api:dev
    build:
      context: ./server
    command: ["node", "dist/sandbox-runner.js"]
    environment:
      NODE_ENV: development
      LOG_LEVEL: debug
      HOST: 0.0.0.0
      PORT: "3100"
      SANDBOX_RUNTIME: ${SANDBOX_RUNTIME:-runc}
      SANDBOX_PARSE_IMAGE: zhibiao-parse:dev
      SANDBOX_EXPORT_IMAGE: zhibiao-export:dev
      # agent 沙箱的专用网络只接入这个容器（8.1）；SANDBOX_AGENT_IMAGE 随 Agent 任务上线（8.6）配置。
      SANDBOX_AGENT_GATEWAY: bidtools-dev-agent-gw
      SANDBOX_RUNNER_TOKEN_FILE: /run/secrets/sandbox_runner_token
    secrets:
      - sandbox_runner_token
    # Docker socket 属于宿主的 docker 组（Linux）或 root 组（Docker Desktop），以该组的身份访问，进程仍是非 root 用户。
    group_add:
      - "${DOCKER_SOCKET_GID:-0}"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - sandbox-control
    <<: *hardening
    restart: unless-stopped

  # agent 沙箱访问平台的唯一入口（docs/SERVER_DESIGN.md 第 7.12 节，路线图第 8 步决定事项第 1 项 B）：与 api 同一镜像，入口为
  # dist/agent-gw.js。**不持有任何凭据**：不挂载 secret，没有数据库、Redis、对象存储、主密钥的配置（出现即拒绝启动）。
  # 只做令牌格式、大小与时限检查，再经 internal 网络 agent-relay 转给 worker 的内部入口；只在 agent-relay 上，连不到数据库、
  # Redis、sandbox-runner 和外网。sandbox-runner 创建 agent 沙箱时把它接入该沙箱的专用网络（按固定的容器名查找），
  # 沙箱经 /etc/hosts 中的 agent-gw:8080 访问它。
  agent-gw:
    image: bidtools-api:dev
    build:
      context: ./server
    command: ["node", "dist/agent-gw.js"]
    container_name: bidtools-dev-agent-gw
    environment:
      NODE_ENV: development
      LOG_LEVEL: debug
      HOST: 0.0.0.0
      PORT: "8080"
      AGENT_GW_UPSTREAM: http://worker:3200
    networks:
      - agent-relay
    <<: *hardening
    restart: unless-stopped

secrets:
  postgres_password:
    file: ./server/.dev-secrets/postgres_password
  db_owner_password:
    file: ./server/.dev-secrets/db_owner_password
  db_app_password:
    file: ./server/.dev-secrets/db_app_password
  ai_kek:
    file: ./server/.dev-secrets/ai_kek
  s3_secret_key:
    file: ./server/.dev-secrets/s3_secret_key
  redis_password:
    file: ./server/.dev-secrets/redis_password
  sandbox_runner_token:
    file: ./server/.dev-secrets/sandbox_runner_token

# backend：Redis 所在的网络，只有 api 和 worker 加入。开发环境需要把 Redis 端口映射到本机供集成测试使用，
# 所以没有设为 internal（internal 网络不能映射端口）；生产部署的网络划分见 docs/SERVER_DESIGN.md 第 8.1 节。
# sandbox-control：sandbox-runner 所在的内部网络（internal，不能访问外网）；只有 worker 加入以调用它（6.6），api 不加入。
# agent-relay：agent-gw 与 worker 之间的内部网络（internal，8.2b），只有这两个服务加入。
networks:
  backend:
  sandbox-control:
    internal: true
  agent-relay:
    internal: true

volumes:
  pgdata:
  s3data:
