name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  naming-check:
    name: Banned words
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check banned words in tracked files
        run: bash scripts/check-banned-words.sh

  client-checks:
    name: Client build / syntax / audit
    runs-on: ubuntu-latest
    timeout-minutes: 30

    defaults:
      run:
        working-directory: client
        shell: bash

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit --no-fund

      - name: Build (tsc --noEmit + vite build)
        run: npm run build

      - name: Unit tests (Vitest)
        run: npm run test

      - name: Syntax check Electron .cjs/.mjs
        run: |
          set -uo pipefail
          count=0
          failed=0
          while IFS= read -r -d '' file; do
            count=$((count + 1))
            if ! node --check "$file"; then
              echo "::error file=client/${file}::node --check failed"
              failed=$((failed + 1))
            fi
          done < <(find electron -type f \( -name '*.cjs' -o -name '*.mjs' \) -print0)
          echo "Checked ${count} files, ${failed} failed."
          if [ "$count" -eq 0 ]; then
            echo "::error::No .cjs/.mjs files found under client/electron."
            exit 1
          fi
          [ "$failed" -eq 0 ]

      - name: npm audit (fail on critical)
        run: npm audit --audit-level=critical

  openxmlhelper-checks:
    name: OpenXmlHelper build / test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    defaults:
      run:
        working-directory: openxmlhelper
        shell: bash

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # SDK 版本按 openxmlhelper/global.json（10.0.1xx，rollForward latestFeature）。
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: openxmlhelper/global.json

      # 按测试项目的 packages.lock.json 还原（含助手本身的传递依赖）；
      # NuGetAudit 在还原时检查已知漏洞，high / critical（NU1903 / NU1904）视为错误。
      - name: Restore (locked mode, NuGet audit)
        run: dotnet restore tests/OpenXmlHelper.Tests/OpenXmlHelper.Tests.csproj --locked-mode

      - name: Build (Release)
        run: dotnet build tests/OpenXmlHelper.Tests/OpenXmlHelper.Tests.csproj --configuration Release --no-restore

      - name: Unit tests (xUnit)
        run: dotnet test tests/OpenXmlHelper.Tests/OpenXmlHelper.Tests.csproj --configuration Release --no-build --logger "console;verbosity=normal"

  server-checks:
    name: Server typecheck / test / audit
    runs-on: ubuntu-latest
    # 6.5 起含 parse 沙箱镜像（LibreOffice）的构建和 gVisor 下的隔离测试；7.1 起另含 export 沙箱镜像（.NET 助手 + Chromium）
    # 的构建和两个 export 模板的同一套隔离测试。
    timeout-minutes: 50

    # 数据库集成测试（npm run test:db）用的 PostgreSQL，与 docker-compose.yml 使用同一镜像 digest。
    # 只在 CI 的一次性容器中使用，超级用户密码不是密钥。
    services:
      postgres:
        image: postgres:17.11-bookworm@sha256:3645570cccdfa447589da9f57dd740faa29b30938e861289a5574b6ca6b03826
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready --username=postgres --dbname=postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20

    defaults:
      run:
        working-directory: server
        shell: bash

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          # 与 server/Dockerfile 的基础镜像保持一致
          node-version: 24.21.0
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit --no-fund

      # 文件存储集成测试用的 S3 兼容服务，与 docker-compose.yml 的 s3 服务使用同一镜像 digest 和参数。
      # 服务容器不能指定启动命令（weed mini），所以在这里启动。访问密钥只用于 CI 的一次性容器，不是机密。
      - name: Start SeaweedFS (S3)
        run: |
          docker run -d --name seaweedfs -p 127.0.0.1:8333:8333 \
            -e AWS_ACCESS_KEY_ID=ci-access -e AWS_SECRET_ACCESS_KEY=ci-secret-key \
            chrislusf/seaweedfs:4.48@sha256:4e61d15fd35994cb1e43e1e553dff106794841fd9a99ade2fc8c8bfce4d7872d \
            mini -dir=/data -ip=127.0.0.1 -ip.bind=0.0.0.0 \
            -master.telemetry=false -admin.ui=false -webdav=false -s3.port.iceberg=0 -s3.port.lance=0 \
            -s3.autoCreateBucket=false
          for attempt in $(seq 1 60); do
            if curl -fsS -o /dev/null http://127.0.0.1:8333/healthz; then exit 0; fi
            sleep 1
          done
          docker logs seaweedfs
          exit 1

      # Redis 集成测试用的 Valkey，与 docker-compose.yml 的 redis 服务使用同一镜像 digest 和同一启动脚本（同样的 ACL）。
      # 服务容器不能指定启动命令和挂载仓库文件，所以在这里启动。密码只用于 CI 的一次性容器，不是机密。
      - name: Start Valkey (Redis)
        run: |
          mkdir -p "$RUNNER_TEMP/redis"
          echo ci-redis-password > "$RUNNER_TEMP/redis/redis_password"
          chmod 644 "$RUNNER_TEMP/redis/redis_password"
          docker run -d --name valkey -p 127.0.0.1:6379:6379 --user 999:999 --read-only --tmpfs /tmp:size=64m \
            --cap-drop ALL --security-opt no-new-privileges:true \
            -e REDIS_PASSWORD_FILE=/run/secrets/redis_password \
            -v "$RUNNER_TEMP/redis/redis_password:/run/secrets/redis_password:ro" \
            -v "$PWD/redis/start-valkey.sh:/opt/start-valkey.sh:ro" \
            --entrypoint /bin/sh \
            valkey/valkey:8.1.10-trixie@sha256:640c5e62cea04b6d6f2084232651d0cc70362d31f4f805e7be94dbed6855e8f2 \
            /opt/start-valkey.sh
          for attempt in $(seq 1 30); do
            if docker exec -e REDISCLI_AUTH=ci-redis-password valkey valkey-cli --user bidtools ping 2>/dev/null | grep -q PONG; then exit 0; fi
            sleep 1
          done
          docker logs valkey
          exit 1

      - name: Typecheck (tsc --noEmit)
        run: npm run typecheck

      - name: Build (tsc emit)
        run: npm run build

      # 8.6b：agent 沙箱入口中的 Pi 会话（sandbox/agent/pi.mjs）的单元测试（tests/agent/piSession.test.ts）加载真实的 Pi 运行时，
      # 按 sandbox/agent/package-lock.json 安装（与镜像相同：不执行安装脚本、不装可选依赖）。
      - name: Install agent sandbox dependencies (Pi runtime, for unit tests)
        working-directory: server/sandbox/agent
        run: npm ci --omit=optional --ignore-scripts --no-audit --no-fund

      - name: Unit tests (Vitest)
        run: npm run test

      - name: Database tests (migrations, RLS, /readyz, file storage, redis, job queue, events)
        run: npm run test:db
        env:
          TEST_DATABASE_ADMIN_URL: postgres://postgres:postgres@127.0.0.1:5432/postgres
          TEST_S3_ENDPOINT: http://127.0.0.1:8333
          TEST_S3_ACCESS_KEY_ID: ci-access
          TEST_S3_SECRET_ACCESS_KEY: ci-secret-key
          TEST_REDIS_URL: redis://bidtools@127.0.0.1:6379
          TEST_REDIS_PASSWORD: ci-redis-password
          # 任务队列测试中真实重启 Valkey（不持久化，重启即清空），验证任务从 jobs 表恢复、不丢失、不重复执行。
          TEST_REDIS_RESTART_COMMAND: docker restart valkey

      # 解析沙箱的隔离测试（路线图 6.5）在 gVisor 下运行（第 6 步决定事项第 2 项）。runsc 按版本固定、按写死的 SHA-512 校验
      # （gVisor 官方发布，Apache-2.0）；登记为 Docker 的运行时后 reload（不重启 Docker，已启动的服务容器不受影响）。
      - name: Install gVisor (runsc)
        run: |
          set -euo pipefail
          version=20260810.0
          sha512=4463ce276e207f5a516a08ec627a768a19cf7bed0094d522b0810bee3424585caa8d344e093204012b974f5c508ab2362dcb0d7236f0c1992fccc426beeb7ffc
          curl -fsSL -o "$RUNNER_TEMP/runsc" "https://storage.googleapis.com/gvisor/releases/release/${version}/x86_64/runsc"
          echo "${sha512}  $RUNNER_TEMP/runsc" | sha512sum -c -
          sudo install -m 0755 "$RUNNER_TEMP/runsc" /usr/local/bin/runsc
          sudo /usr/local/bin/runsc install
          sudo systemctl reload docker
          for attempt in $(seq 1 10); do
            if docker info --format '{{json .Runtimes}}' | grep -q '"runsc"'; then runsc --version; exit 0; fi
            sleep 1
          done
          docker info
          exit 1

      # 6.6 起镜像含解析入口与其 npm 依赖（按 sandbox/parse/package-lock.json 在构建阶段安装）和 LibreOffice 的安全设置。
      - name: Build parse sandbox image
        run: docker build -t zhibiao-parse:ci sandbox/parse

      # 宏安全测试的对照镜像：同一镜像只去掉 LibreOffice 的安全设置（zhibiao-security.xcd），证明测试能发现设置被去掉。只用于测试，不发布。
      - name: Build control image without the LibreOffice security settings
        run: |
          docker build -t zhibiao-parse:ci-control - <<'EOF'
          FROM zhibiao-parse:ci
          USER root
          RUN rm /usr/lib/libreoffice/share/registry/zhibiao-security.xcd
          USER 10001:10001
          EOF

      # 7.1：export 沙箱镜像。助手源码与装饰生成器经具名构建上下文取自 openxmlhelper/ 与 client/electron/shared/chrome（与桌面版同一份代码）；
      # 7.3b 起另有模板样张的固定配图，取自 client/assets/content-template-preview（与桌面版同一份文件）。
      # 7.5b 起另有桌面版的可研导出代码（exportService.cjs 等 6 个文件），取自 client/electron；依赖按 sandbox/export/desktop/package-lock.json 安装。
      # .NET SDK 只在构建阶段，chromium-headless-shell 由镜像中的 playwright-core（按 sandbox/export/package-lock.json 安装）下载对应版本。
      - name: Build export sandbox image
        run: |
          docker build -t zhibiao-export:ci \
            --build-context openxmlhelper=../openxmlhelper \
            --build-context chrome=../client/electron/shared/chrome \
            --build-context preview-assets=../client/assets/content-template-preview \
            --build-context desktop=../client/electron \
            sandbox/export

      # 8.1：agent 沙箱镜像（Node 24 + rg / fd / jq）；8.6a 起含入口 /opt/agent/entry.mjs；8.6b 起含 Pi 运行时（按 sandbox/agent/package-lock.json
      # 在构建阶段安装，最终镜像不含 npm 与原生模块）与入口中的 Pi 会话（pi.mjs）。
      - name: Build agent sandbox image
        run: docker build -t zhibiao-agent:ci sandbox/agent

      - name: Sandbox isolation, parse, export and agent tests (gVisor)
        run: npm run test:sandbox
        env:
          TEST_SANDBOX_IMAGE: zhibiao-parse:ci
          TEST_SANDBOX_RUNTIME: runsc
          TEST_SANDBOX_OFFICE: '1'
          TEST_SANDBOX_CONTROL_IMAGE: zhibiao-parse:ci-control
          TEST_SANDBOX_EXPORT_IMAGE: zhibiao-export:ci
          TEST_SANDBOX_AGENT_IMAGE: zhibiao-agent:ci
          # 解析卡住时的解析任务测试（tests/sandbox/docker/parseJob.test.ts）与假模型端到端（agentEndToEnd.test.ts，8.6e1）
          # 在真实沙箱和数据库上执行任务；端到端另经真实队列（与前面步骤同一个 Valkey）驱动执行者。
          TEST_DATABASE_ADMIN_URL: postgres://postgres:postgres@127.0.0.1:5432/postgres
          TEST_REDIS_URL: redis://bidtools@127.0.0.1:6379
          TEST_REDIS_PASSWORD: ci-redis-password

      - name: Shell script syntax (bash -n)
        run: bash -n db/init/10-provision.sh && bash -n scripts/init-dev-secrets.sh && sh -n redis/start-valkey.sh

      # server 根依赖的 high/critical 审计门：裸 `npm audit --audit-level=high` 无法按编号放行单个公告，这里用脚本实现——
      # 只放行 AUDIT_ALLOWLIST 中、未到期的公告（当前仅 GHSA-fc5q-39xc-vjpf：picomatch ReDoS，仅 vitest/vite 开发依赖链，
      # 不进生产，到期日 2026-12-02），其余 high/critical 仍使 CI 失败；到期后自动恢复拦截。理由与范围见 CLAUDE.md
      # 「已接受风险（CI 审计豁免）」，逻辑由 tests/ci/auditHigh.test.ts 验证。
      - name: npm audit (fail on high, scoped allowlist)
        run: node scripts/ci-audit-high.mjs

      # parse 沙箱镜像中的解析依赖（mammoth、pdfjs、SheetJS 等）单独一份 lockfile。
      - name: npm audit parse sandbox dependencies (fail on high)
        working-directory: server/sandbox/parse
        run: npm audit --audit-level=high

      # agent 沙箱镜像中的 Pi 运行时（@earendil-works/pi-coding-agent、pi-ai，8.6b）与 json-validation 用的 ajv（8.6c2a），版本取自 client/package-lock.json。
      - name: npm audit agent sandbox dependencies (fail on high)
        working-directory: server/sandbox/agent
        run: npm audit --audit-level=high

      # export 沙箱镜像中的入口依赖（playwright-core）单独一份 lockfile。
      - name: npm audit export sandbox dependencies (fail on high)
        working-directory: server/sandbox/export
        run: npm audit --audit-level=high

      # export 沙箱镜像中可研导出的依赖（docx、cheerio、markdown-it 等，7.5b），版本取自 client/package-lock.json。
      - name: npm audit export sandbox desktop export dependencies (fail on high)
        working-directory: server/sandbox/export/desktop
        run: npm audit --audit-level=high
